name: Deploy site

# Static site — no build step. The public/ folder is uploaded to GitHub
# Pages exactly as it sits (pages live at clean, extensionless URLs there —
# e.g. public/about/index.html serves at /about/ — since Pages, like
# express.static, serves index.html for a directory request by default).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No `enablement: true` here on purpose. Creating a Pages site is an
      # admin operation and GITHUB_TOKEN is never granted it, so that flag
      # only ever fails with "Resource not accessible by integration".
      # Pages must be switched on once by hand: Settings -> Pages ->
      # Build and deployment -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - id: deployment
        uses: actions/deploy-pages@v4
